<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="weather-app">
        <h1>Welcome to My Weather App</h1>
        <p class="subtitle">Discover the weather in your city</p>

        <form id="weatherForm">
            <input type="text" id="cityInput" placeholder="Enter city name..." aria-label="City name" required>
            <button type="submit" id="searchBtn">Search</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="weatherResult" class="weather-result" hidden>
            <h2 id="cityName"></h2>
            <img id="weatherIcon" src="" alt="Weather icon">
            <p id="description" class="description"></p>
            <p id="temperature" class="temperature"></p>

            <div class="details">
                <div class="detail-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity"></strong>
                </div>

                <div class="detail-card">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind"></strong>
                </div>
            </div>
        </section>

        <footer>
             OpenWeatherMap
        </footer>
    </main>
    <script src="script.js"></script>
</body>

</html>
