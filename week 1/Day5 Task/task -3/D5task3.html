<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY CALCULATOR</title>
    <link rel="stylesheet" href="task3style.css">
</head>

<body>
    <section class="calculator">
        <!-- <h2>CALCULATOR </h2> -->
        <div class="calci">
            <label for="number" id="operator"></label>
            <input type="number" id="display" value="0">
        </div>
        <div class="buttons">
            <button class="clear" onclick="clearAll()">AC</button>
            <button class="operator" onclick="operatorAdd('%')">%</button>
            <button id="del" onclick="backspace()">Del</button>
            <button class="operator" onclick="operatorAdd('/')">÷</button>
        
            <!--row1-->
            <button onclick="inputNumber('7')">7</button>
            <button onclick="inputNumber('8')">8</button>
            <button onclick="inputNumber('9')">9</button>
            <button class="Minus" onclick="operatorAdd('*')">x</button>
        
            <!--row2-->
            <button onclick="inputNumber('4')">4</button>
            <button onclick="inputNumber('5')">5</button>
            <button onclick="inputNumber('6')">6</button>
            <button class="btn operator" onclick="operatorAdd('-')">-</button>
            <!--row3-->
            <button onclick="inputNumber('1')">1</button>
            <button onclick="inputNumber('2')">2</button>
            <button onclick="inputNumber('3')">3</button>
            <button class="plus" onclick="operatorAdd('+')">+</button>
            
            <!--row4-->
            <button onclick="inputNumber('0')">00</button>
            <button onclick="inputNumber('0')">0</button>
            <button  class="point" onclick="inputNumber('.')">.</button>
            <button class="equal" onclick="equal()">=</button>
        </div>
    </section>
    <script src="task3.js">

    </script>

</body>

</html>
