<!DOCTYPE html>

    <title>Function of Area of Rectangle</title>
</head>
<body>
    <h2>Area Of Rectangle</h2>
 <script>
   function areaofrectangle(length,width)
   {
    return length*width;
   }
   let area = areaofrectangle(50,2)
   console.log("Area of rectangle =",area );

 </script>
    
    
</body>
